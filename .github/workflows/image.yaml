# Checks every push and pull request. A v* tag also builds the image and
# pushes it to Docker Hub under that exact tag, which is what the overlay's
# newTag names. Logging in needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# repository secrets.
#
# The image is built for linux/amd64 only, because that is what kholinar runs.
# There is no lock file, so the checks here run against the same freshly
# resolved dependencies the image will get. A breaking upstream release fails
# this job instead of shipping.

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  image:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: docker.io/stmcallisterbridge4/spanreed:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
