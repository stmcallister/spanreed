# The host is environment specific and is patched by the overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spanreed-web
  labels:
    app.kubernetes.io/name: spanreed
spec:
  rules:
    - host: spanreed.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spanreed-web
                port:
                  name: http
