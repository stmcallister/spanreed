# The management UI. Always on, and the only workload that serves traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spanreed-web
  labels:
    app.kubernetes.io/name: spanreed
    app.kubernetes.io/component: web
spec:
  replicas: 1
  # One writer at a time. Recreate rather than RollingUpdate, because a second
  # pod cannot mount a ReadWriteOnce volume while the first still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spanreed
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spanreed
        app.kubernetes.io/component: web
    spec:
      # Pinned to the node holding the ReadWriteOnce volume.
      nodeSelector:
        spanreed.stmcallister.dev/data-node: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Matches the image's uid so the non-root process can write to the PVC.
        fsGroup: 1000
      containers:
        - name: web
          image: ghcr.io/stmcallister/spanreed:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "spanreed"]
          args: ["web"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: spanreed-config
            - secretRef:
                name: spanreed-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spanreed-data
        - name: tmp
          emptyDir: {}
