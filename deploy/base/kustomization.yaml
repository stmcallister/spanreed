apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: newsbrief

resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment-web.yaml
  - service.yaml
  - ingress.yaml
  - cronjob-collector.yaml
  - cronjob-composer.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: newsbrief
      app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/stmcallister/newsbrief
    newTag: latest
